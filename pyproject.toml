[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kofia-am-profile"
version = "0.1.0"
description = "KOFIA 자산운용사 종합 프로파일: FreeSIS + KOFIA 회원사 조인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
kofia-am = "kofia_am_profile.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
